
name: JANCLUB Shop Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository indir
        uses: actions/checkout@v4

      - name: Java 21 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven ile derle
        run: mvn -B clean package

      - name: JAR dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: JANCLUB-Shop
          path: target/JANCLUB-Shop.jar
          if-no-files-found: error
